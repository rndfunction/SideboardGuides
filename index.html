<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Deck Guide Builder</title>
<link rel="stylesheet" href="https://unpkg.com/@trussworks/react-uswds@3.0.0/lib/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app">
  <main class="grid-container">
    <header class="site-header">
      <h1>MTG Deck Guide Builder</h1>
      <p class="usa-intro">Paste a decklist. Get a title card and a sideboard guide.</p>
    </header>

    <deck-input
      :parsed="parsed"
      :loading="loading"
      :error="error"
      @parse="onParse"
      @reset="onReset"
    ></deck-input>

    <guide-toolbar
      v-if="enriched"
      :deck-name="deckName"
      :raw-text="store.rawText"
      :matchups="matchups"
      :plan="plan"
      @load-state="onLoadState"
      @add-matchups="onAddMatchups"
    ></guide-toolbar>

    <section v-if="parsed && parsed.mainboard.length" class="deck-results">
      <title-card
        :deck="enriched"
        :deck-name="deckName"
        @update:deck-name="onDeckNameChange"
      ></title-card>

      <sideboard-guide
        :deck="enriched"
        :matchups="matchups"
        :plan="plan"
        @add-matchup="addMatchup"
        @remove-matchup="removeMatchup"
        @toggle-card="toggleCard"
      ></sideboard-guide>
    </section>

    <footer class="usa-footer__primary-section" v-if="!parsed">
      <p>No data leaves your browser except card lookups to Scryfall.</p>
    </footer>
  </main>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
