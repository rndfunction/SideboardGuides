<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Deck Guide Builder</title>
<link rel="stylesheet" href="https://unpkg.com/@trussworks/react-uswds@3.0.0/lib/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app">
  <!-- ============================================================
       On-screen application shell. Hidden entirely when printing.
       ============================================================ -->
  <div class="app-shell">
    <main class="grid-container">
      <header class="site-header">
        <h1>MTG Deck Guide Builder</h1>
        <p class="usa-intro">Paste a decklist. Build a sideboard guide. Print 3x4in cards for the deckbox.</p>
      </header>

      <deck-input
        :parsed="parsed"
        :loading="loading"
        :error="error"
        @parse="onParse"
        @reset="onReset"
      ></deck-input>

      <guide-toolbar
        v-if="enriched"
        :deck-name="deckName"
        :raw-text="store.rawText"
        :matchups="matchups"
        :plan="plan"
        :print-open="showPrint"
        @load-state="onLoadState"
        @add-matchups="onAddMatchups"
        @toggle-print="onTogglePrint"
      ></guide-toolbar>

      <!-- Live print preview sits above the grid so it reads as the
           artifact being designed, with the grid below as the tool. -->
      <print-view
        v-if="enriched && showPrint"
        :deck="enriched"
        :deck-name="deckName"
        :format="selectedFormat"
        :matchups="matchups"
        :plan="plan"
        @close="onClosePrint"
      ></print-view>

      <deck-grid
        v-if="enriched"
        :deck="enriched"
        :matchups="matchups"
        :plan="plan"
        :deck-name="deckName"
        @add-matchup="addMatchup"
        @rename-matchup="onRenameMatchup"
        @remove-matchup="removeMatchup"
        @toggle-card="onToggleCard"
        @set-card-plan="onSetCardPlan"
        @update:deck-name="onDeckNameChange"
      ></deck-grid>

      <footer class="usa-footer__primary-section" v-if="!parsed">
        <p>No data leaves your browser except card lookups to Scryfall.</p>
      </footer>
    </main>
  </div>

  <!-- ============================================================
       Print-only root. Hidden on screen; sole visible block on print.
       ============================================================ -->
  <div class="print-root">
    <print-view
      v-if="enriched && showPrint"
      :deck="enriched"
      :deck-name="deckName"
      :format="selectedFormat"
      :matchups="matchups"
      :plan="plan"
      :print-mode="true"
      @close="onClosePrint"
    ></print-view>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
