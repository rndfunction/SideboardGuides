name: Update Presets

on:
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cloudscraper beautifulsoup4

      - name: Refresh presets.json
        run: python3 fetch_presets.py --out presets.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- presets.json; then
            echo "No change to presets.json; nothing to commit."
            exit 0
          fi
          git config user.name "preset-bot"
          git config user.email "preset-bot@users.noreply.github.com"
          git add presets.json
          git commit -m "chore: refresh presets.json from MTGGoldfish"
          git push